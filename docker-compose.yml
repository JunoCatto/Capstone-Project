services:
  mongo:
    image: mongo:6.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongo:27017/capstone_db
      - CLIENT_URL=http://localhost:3000
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  client: 
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://server:5000
    ports:
      - "3000:3000"
    depends_on:
      - server
volumes:
  mongo-data:
